{% comment %}
	FAQPage JSON-LD for the /faq/ index, built from the `_faq` collection:
	each question's title and short_answer (the full answer lives on its own page).
{% endcomment %}
{% assign questions = site.faq | sort: "order" %}
<script type="application/ld+json">
{
	"@context": "https://schema.org",
	"@type": "FAQPage",
	"@id": "{{ page.url | absolute_url }}#faq",
	"mainEntity": [{% for q in questions %}
		{
			"@type": "Question",
			"name": {{ q.title | jsonify }},
			"url": "{{ q.url | absolute_url }}",
			"acceptedAnswer": { "@type": "Answer", "text": {{ q.short_answer | jsonify }}, "url": "{{ q.url | absolute_url }}" }
		}{% unless forloop.last %},{% endunless %}{% endfor %}
	]
}
</script>
