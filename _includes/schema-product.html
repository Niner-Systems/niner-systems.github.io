{% comment %}
	Product + Offer JSON-LD, driven by the page's `product:` front matter.
	Each offer may set its own `price`; otherwise the product `msrp` is used.
{% endcomment %}
{% assign product = page.product %}
{% assign shipping = site.data.company.shipping %}
<script type="application/ld+json">
{
	"@context": "https://schema.org",
	"@type": "Product",
	"@id": "{{ page.url | absolute_url }}#product",
	"name": {{ product.name | jsonify }},
	"description": {{ page.description | jsonify }},
	"image": "{{ page.image | absolute_url }}",
	"sku": {{ product.sku | jsonify }},{% if product.gtin12 %}
	"gtin12": {{ product.gtin12 | jsonify }},{% endif %}
	"category": {{ product.category | jsonify }},
	"url": "{{ page.url | absolute_url }}",
	"brand": { "@type": "Brand", "name": {{ site.data.company.name | jsonify }} },
	"manufacturer": { "@id": "{{ '/' | absolute_url }}#organization" },{% if product.specs %}
	"additionalProperty": [{% for spec in product.specs %}
		{ "@type": "PropertyValue", "name": {{ spec.name | jsonify }}, "value": {{ spec.value | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
	],{% endif %}{% comment %}Only first-party reviews: Google forbids marking up reviews copied from other sites (e.g. Amazon).{% endcomment %}{% if page.reviews.schema_count > 0 %}
	"aggregateRating": {
		"@type": "AggregateRating",
		"ratingValue": "{{ page.reviews.schema_average }}",
		"reviewCount": {{ page.reviews.schema_count }},
		"bestRating": "5",
		"worstRating": "1"
	},
	"review": [{% for r in page.reviews.schema_items %}
		{
			"@type": "Review",
			"author": { "@type": "Person", "name": {{ r.display_name | jsonify }} },
			"datePublished": "{{ r.date | date: '%Y-%m-%d' }}",
			"reviewBody": {{ r.text | jsonify }},
			"reviewRating": { "@type": "Rating", "ratingValue": "{{ r.rating }}", "bestRating": "5", "worstRating": "1" }
		}{% unless forloop.last %},{% endunless %}{% endfor %}
	],{% endif %}
	"offers": [{% for offer in product.offers %}
		{
			"@type": "Offer",
			"name": {{ offer.name | default: product.name | jsonify }},{% if offer.sku %}
			"sku": {{ offer.sku | jsonify }},{% endif %}
			"url": "{{ offer.url | absolute_url }}",
			"price": "{{ offer.price | default: product.msrp }}",
			"priceCurrency": "USD",
			"availability": "https://schema.org/{{ offer.availability | default: 'InStock' }}",
			"itemCondition": "https://schema.org/NewCondition",
			"seller": {% if offer.seller == site.data.company.name %}{ "@id": "{{ '/' | absolute_url }}#organization" },
			"shippingDetails": {
				"@type": "OfferShippingDetails",
				"shippingRate": { "@type": "MonetaryAmount", "value": "{{ shipping.cost }}", "currency": "USD" },
				"shippingDestination": { "@type": "DefinedRegion", "addressCountry": {{ shipping.country | jsonify }} },
				"deliveryTime": {
					"@type": "ShippingDeliveryTime",
					"handlingTime": { "@type": "QuantitativeValue", "minValue": {{ shipping.handling_days[0] }}, "maxValue": {{ shipping.handling_days[1] }}, "unitCode": "DAY" },
					"transitTime": { "@type": "QuantitativeValue", "minValue": {{ shipping.transit_days[0] }}, "maxValue": {{ shipping.transit_days[1] }}, "unitCode": "DAY" }
				}
			},
			"hasMerchantReturnPolicy": {% include schema-return-policy.html %}{% else %}{ "@type": "Organization", "name": {{ offer.seller | jsonify }} }{% endif %}
		}{% unless forloop.last %},{% endunless %}{% endfor %}
	]
}
</script>
