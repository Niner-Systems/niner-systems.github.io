{% comment %}
	Product + Offer JSON-LD, driven by the page's `product:` front matter.
	Each offer may set its own `price`; otherwise the product `msrp` is used.
{% endcomment %}
{% assign product = page.product %}
<script type="application/ld+json">
{
	"@context": "https://schema.org",
	"@type": "Product",
	"@id": "{{ page.url | absolute_url }}#product",
	"name": {{ product.name | jsonify }},
	"description": {{ page.description | jsonify }},
	"image": "{{ page.image | absolute_url }}",
	"sku": {{ product.sku | jsonify }},{% if product.gtin12 %}
	"gtin12": {{ product.gtin12 | jsonify }},{% endif %}
	"category": {{ product.category | jsonify }},
	"url": "{{ page.url | absolute_url }}",
	"brand": { "@type": "Brand", "name": {{ site.data.company.name | jsonify }} },
	"manufacturer": { "@id": "{{ '/' | absolute_url }}#organization" },
	"offers": [{% for offer in product.offers %}
		{
			"@type": "Offer",
			"name": {{ offer.name | default: product.name | jsonify }},{% if offer.sku %}
			"sku": {{ offer.sku | jsonify }},{% endif %}
			"url": "{{ offer.url | absolute_url }}",
			"price": "{{ offer.price | default: product.msrp }}",
			"priceCurrency": "USD",
			"availability": "https://schema.org/{{ offer.availability | default: 'InStock' }}",
			"itemCondition": "https://schema.org/NewCondition",
			"seller": {% if offer.seller == site.data.company.name %}{ "@id": "{{ '/' | absolute_url }}#organization" }{% else %}{ "@type": "Organization", "name": {{ offer.seller | jsonify }} }{% endif %}
		}{% unless forloop.last %},{% endunless %}{% endfor %}
	]
}
</script>
