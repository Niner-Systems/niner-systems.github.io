{% assign company = site.data.company %}
<script type="application/ld+json">
{
	"@context": "https://schema.org",
	"@type": "Organization",
	"@id": "{{ '/' | absolute_url }}#organization",
	"name": {{ company.name | jsonify }},
	"legalName": {{ company.legal_name | jsonify }},
	"slogan": {{ company.slogan | jsonify }},
	"description": {{ site.description | jsonify }},
	"url": "{{ '/' | absolute_url }}",
	"logo": "{{ company.logo | absolute_url }}",
	"email": {{ company.email | jsonify }},
	"founder": [{% for person in site.staff_members %}
		{
			"@type": "Person",
			"name": {{ person.name | jsonify }},
			"jobTitle": {{ person.position | jsonify }},
			"url": "{{ '/about/' | absolute_url }}"{% if person.linkedin %},
			"sameAs": [{{ person.linkedin | jsonify }}]{% endif %}
		}{% unless forloop.last %},{% endunless %}{% endfor %}
	],
	"contactPoint": {
		"@type": "ContactPoint",
		"contactType": "customer support",
		"email": {{ company.email | jsonify }},
		"url": "{{ '/contact/' | absolute_url }}",
		"areaServed": "US",
		"availableLanguage": "English"
	},
	"hasMerchantReturnPolicy": {% include schema-return-policy.html %},
	"address": {
		"@type": "PostalAddress",
		"addressLocality": {{ company.locality | jsonify }},
		"addressRegion": {{ company.region | jsonify }},
		"addressCountry": {{ company.country | jsonify }}
	},
	"sameAs": {{ company.same_as | jsonify }}
}
</script>
