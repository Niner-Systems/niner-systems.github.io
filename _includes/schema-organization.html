{% assign company = site.data.company %}
<script type="application/ld+json">
{
	"@context": "https://schema.org",
	"@type": "Organization",
	"@id": "{{ '/' | absolute_url }}#organization",
	"name": {{ company.name | jsonify }},
	"legalName": {{ company.legal_name | jsonify }},
	"slogan": {{ company.slogan | jsonify }},
	"description": {{ site.description | jsonify }},
	"url": "{{ '/' | absolute_url }}",
	"logo": "{{ company.logo | absolute_url }}",
	"email": {{ company.email | jsonify }},
	"founder": [{% for founder in company.founders %}{ "@type": "Person", "name": {{ founder | jsonify }} }{% unless forloop.last %}, {% endunless %}{% endfor %}],
	"address": {
		"@type": "PostalAddress",
		"addressLocality": {{ company.locality | jsonify }},
		"addressRegion": {{ company.region | jsonify }},
		"addressCountry": {{ company.country | jsonify }}
	},
	"sameAs": {{ company.same_as | jsonify }}
}
</script>
